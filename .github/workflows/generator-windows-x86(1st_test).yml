name: Custom Windows x86 Client Generator (Flutter)
run-name: Custom Windows x86 Client Generator (Flutter)
on:
  workflow_dispatch:
    # inputs:
    #   version:
    #     description: 'version to build'
    #     required: true
    #     default: ''
    #     type: string
    #   zip_url:
    #     description: 'url to zip of json'
    #     required: true
    #     default: ''
    #     type: string

env:
  # === Rust/Flutter versions ===
  RUST_VERSION: "1.75"                    # stable, не nightly!
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  
  # === App branding ===
  VERSION: "${{ inputs.version }}"
  appname: "SSQS"
  filename: "SSQS"
  compname: "Sigma-Soft"
  server: "rd.sigma-soft.ru"
  key: "kn5QUYXLEPBepybeHbyw9mzSibyGM8xsq6Eh8Zu5k40="
  apiServer: "https://rd.sigma-soft.ru"
  
  # === Build config ===
  UPLOAD_ARTIFACT: 'true'
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh "
  rdgen: "local"
  token: ""
  uuid: ""
  custom: "eyJjb25uLXR5cGUiOiJvdXRnb2luZyIsImRpc2FibGUtaW5zdGFsbGF0aW9uIjoiWSIsImRpc2FibGUtc2V0dGluZ3MiOiJOIiwiYXBwLW5hbWUiOiJTaWdtYURlc2siLCJvdmVycmlkZS1zZXR0aW5ncyI6eyJ0aGVtZSI6ImxpZ2h0IiwiYWxsb3ctcmVtb3ZlLXdhbGxwYXBlciI6IlkifX0="
  iconlink_url: "false"
  iconlink_file: ""
  iconlink_uuid: ""
  logolink_url: "false"
  logolink_file: ""
  logolink_uuid: ""
  delayFix: "false"
  cycleMonitor: "false"
  xOffline: "false"
  removeNewVersionNotif: "true"
  runasadmin: "false"
  urlLink: "https://sigma-soft.ru"
  downloadLink: "https://sigma-soft.ru"

  # === vcpkg ===
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_DEFAULT_HOST_TRIPLET: "x86-windows-static"

jobs:
  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  build-for-windows-flutter-x86:
    name: Build Windows x86 (Flutter)
    needs: setup
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: i686-pc-windows-msvc,
              os: windows-2022,
              arch: x86,
              vcpkg-triplet: x86-windows-static,
            }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always()
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip "
          method: 'POST'
          customHeaders: '{ "Content-Type ": "application/json "}'
          data: '{ "uuid ": "${{ env.uuid }} "}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set rdgen value
        if: ${{ env.rdgen == 'true' }}
        run: echo "STATUS_URL=${{ secrets.GENURL }}/updategh " >> $env:GITHUB_ENV

      - name: Set rdgen value
        if: ${{ env.rdgen == 'false' }}
        run: echo "STATUS_URL=${{ env.apiServer }}/api/updategh " >> $env:GITHUB_ENV

      # === Checkout your fork ===
      - name: Checkout source code
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: ThisIsCradle/rustdesk
          ref: ${{ env.VERSION }}
          submodules: recursive

      - name: Checkout source code (master)
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: ThisIsCradle/rustdesk
          submodules: recursive

      # === Install Flutter for x86 ===
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          architecture: x86  # ← критично для ia32-сборки
          cache: true

      - name: Install ImageMagick
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      # === Branding: appname ===
      - name: change appname to custom
        if: env.appname != 'rustdesk'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./Cargo.toml
          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|const APP_PREFIX: \&str = "rustdesk";|const APP_PREFIX: \&str = "${{ env.appname }}";|' ./libs/portable/src/main.rs
          find ./src/lang -name "*.rs" -exec sed -i -e 's|RustDesk|${{ env.appname }}|' {} \;

      # === Branding: company, url, server ===
      - name: change company name
        if: env.compname != 'Purslane Ltd'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|PURSLANE|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./Cargo.toml

      - name: change url to custom
        if: env.urlLink != 'https://rustdesk.com'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e "s|https://rustdesk.com|${{ env.urlLink }}|g" ./build.py ./src/ui/index.tis ./res/setup.nsi

      - name: set server, key, and apiserver
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|rs-ny.rustdesk.com|${{ env.server }}|' ./libs/hbb_common/src/config.rs
          sed -i -e 's|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ env.key }}|' ./libs/hbb_common/src/config.rs
          sed -i -e 's|https://admin.rustdesk.com|${{ env.apiServer }}|' ./src/common.rs

      # === LLVM для bindgen ===
      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}
          directory: ${{ runner.temp }}/llvm

      # === Rust toolchain: STABLE, не nightly! ===
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}-flutter

      # === vcpkg setup ===
      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      # === КРИТИЧНО: экспорт переменных для bindgen ===
      - name: Export vcpkg env for bindgen
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          echo "VCPKG_DEFAULT_HOST_TRIPLET=${{ matrix.job.vcpkg-triplet }}" >> $GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=${{ matrix.job.vcpkg-triplet }}" >> $GITHUB_ENV
          
          # Найти libclang.dll и установить LIBCLANG_PATH
          LIBCLANG_PATH=$(find "$VCPKG_ROOT/installed" -name "libclang.dll" 2>/dev/null | head -1 | xargs dirname | tr '\\' '/')
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
          echo "LIBCLANG_STATIC_PATH=$LIBCLANG_PATH" >> $GITHUB_ENV
          
          # Добавить include-пути vcpkg для clang
          VCPKG_INCLUDE="$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet }}/include"
          echo "CFLAGS=-I$VCPKG_INCLUDE" >> $GITHUB_ENV
          echo "CXXFLAGS=-I$VCPKG_INCLUDE" >> $GITHUB_ENV

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        run: |
          if ! $VCPKG_ROOT/vcpkg install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      # === Icon handling (опционально) ===
      - name: icon stuff
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          mv ./res/icon.ico ./res/icon.ico.bak 2>/dev/null || true
          mv ./res/icon.png ./res/icon.png.bak 2>/dev/null || true

      - name: magick stuff
        if: ${{ env.iconlink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 3
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri "${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}&uuid=${{ env.iconlink_uuid }}" -OutFile ./res/icon.png
            magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico
            cp ./res/icon.ico ./res/tray-icon.ico

      # === ПАПЧИ: allowCustom, delayFix, removeNewVersionNotif ===
      - name: allow custom.txt
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 1
          max_attempts: 3
          shell: pwsh
          continue-on-error: true
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/allowCustom.diff -OutFile allowCustom.diff
            git apply allowCustom.diff || true

      - name: fix connection delay
        continue-on-error: true
        if: ${{ env.delayFix == 'true' }}
        shell: bash
        run: sed -i -e 's|!key.is_empty()|false|' ./src/client.rs

      - name: removeNewVersionNotif
        continue-on-error: true
        if: env.removeNewVersionNotif == 'true'
        shell: bash
        run: |
          sed -i -e 's|{software_update_url ? <UpdateMe /> : ""}||' ./src/ui/index.tis
          sed -i '/let (request, url) =/,/Ok(())/{/Ok(())/!d}' ./src/common.rs || true

      # === BUILD: Flutter вместо cargo build ===
      - name: Build rustdesk (Flutter)
        id: build
        shell: bash
        run: |
          # Сборка через build.py с флагами Flutter
          python3 ./build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          
          # Flutter для x86 использует ia32, не x64
          if [ ! -d "./flutter/build/windows/ia32/runner/Release" ]; then
            echo "ERROR: Flutter build output not found at ia32 path"
            find ./flutter/build -name "Release" -type d || true
            exit 1
          fi
          
          mkdir -p ./Release
          mv ./flutter/build/windows/ia32/runner/Release/* ./Release/ || true
          
          # Драйвер usbmmidd (универсальный)
          curl -LJ -o ./usbmmidd_v2.zip https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip
          unzip -q usbmmidd_v2.zip
          rm -rf ./usbmmidd_v2/deviceinstaller.exe ./usbmmidd_v2/usbmmidd.bat
          mv ./usbmmidd_v2 ./Release || true
          
          echo "output_folder=./Release" >> $GITHUB_OUTPUT

      # === Подпись и упаковка (как в оригинале) ===
      - name: zip dlls
        continue-on-error: true
        shell: pwsh
        run: Compress-Archive -Path ./Release/*.dll,./Release/*.exe -DestinationPath ./Release/unsigned_files.zip -CompressionLevel Fastest

      - name: sign dlls
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./Release/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./Release/signed_files.zip
          else
            cp ./Release/unsigned_files.zip ./Release/signed_files.zip
          fi

      - name: unzip dlls
        continue-on-error: true
        shell: pwsh
        run: |
          Expand-Archive -Path ./Release/signed_files.zip -DestinationPath ./Release/ -Force
          Remove-Item ./Release/unsigned_files.zip ./Release/signed_files.zip

      - name: Create custom.txt file
        shell: bash
        run: echo -n "${{ env.custom }}" > ./Release/custom.txt

      - name: Build self-extracted executable
        shell: bash
        run: |
          mv "./Release/rustdesk.exe" "./Release/${{ env.appname }}.exe" || true
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../Release/ -o . -e "../../Release/${{ env.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/rustdesk.exe"

      - name: sign exe
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] && [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then
            curl -X POST -F "file=@./SignOutput/rustdesk.exe" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 "${{ secrets.SIGN_BASE_URL }}/sign/" -o ./SignOutput/signed.exe
            mv ./SignOutput/signed.exe "./SignOutput/${{ env.filename }}.exe"
          else
            mv "./SignOutput/rustdesk.exe" "./SignOutput/${{ env.filename }}.exe"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: ${{ env.filename }}-Windows-x86-Flutter
          path: ./SignOutput/${{ env.filename }}.exe

  cleanup:
    needs: [build-for-windows-flutter-x86]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: always()
    steps:
      - name: Delete secrets artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: encrypted-secrets-zip





name: Custom Windows x86 Client Generator
run-name: Custom Windows x86 Client Generator
on:
  workflow_dispatch:

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  FLUTTER_ELINUX_VERSION: "3.16.9"

  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"

  VERSION: "1.4.5"
  NDK_VERSION: "r27c"
  UPLOAD_ARTIFACT: "true"
  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: ""

  appname: "SSQS"
  filename: "SSQS"
  compname: "Sigma-Soft"
  server: "rd.sigma-soft.ru"
  key: "kn5QUYXLEPBepybeHbyw9mzSibyGM8xsq6Eh8Zu5k40="
  apiServer: "https://rd.sigma-soft.ru"

  rdgen: "local"
  token: ""
  uuid: ""
  custom: "eyJjb25uLXR5cGUiOiJvdXRnb2luZyIsImRpc2FibGUtaW5zdGFsbGF0aW9uIjoiWSIsImRpc2FibGUtc2V0dGluZ3MiOiJOIiwiYXBwLW5hbWUiOiJTaWdtYURlc2siLCJvdmVycmlkZS1zZXR0aW5ncyI6eyJ0aGVtZSI6ImxpZ2h0IiwiYWxsb3ctcmVtb3ZlLXdhbGxwYXBlciI6IlkifX0="
  iconlink_url: "false"
  iconlink_file: ""
  iconlink_uuid: ""
  logolink_url: "false"
  logolink_file: ""
  logolink_uuid: ""
  delayFix: "false"
  cycleMonitor: "false"
  xOffline: "false"
  removeNewVersionNotif: "true"
  runasadmin: "false"
  urlLink: "https://sigma-soft.ru"
  downloadLink: "https://sigma-soft.ru"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: "1.4.5"

  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: Win32  # ← Изменено: x64 → Win32
      target_version: Windows10
    secrets: inherit
    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows x86
    needs: [build-RustDeskTempTopMostWindow, generate-bridge]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: i686-pc-windows-msvc,  # ← Изменено: x86_64 → i686
              os: windows-2022,
              arch: x86,                      # ← Изменено: x86_64 → x86
              vcpkg-triplet: x86-windows-static,  # ← Изменено: x64 → x86
            }
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Save branding files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\branding"
          Copy-Item ".github/ssqs.ico" "C:\branding\ssqs.ico" -Force
          Copy-Item ".github/Logo.png" "C:\branding\Logo.png" -Force
          Write-Host "Branding files saved"

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: ThisIsCradle/rustdesk
          ref: sigma-1.4.5
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@master
        with:
          name: bridge-artifact
          path: ./

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" | % { $_.FullName } | Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: fix flutter_gpu_texture_renderer
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      # ... [все шаги брендирования, патчей, установки зависимостей — без изменений] ...

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}  # ← Теперь i686-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}  # ← x86-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
        shell: bash

      # ... [шаги с иконками, патчами, custom.txt — без изменений] ...

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --hwcodec --flutter --vram --skip-portable-pack
          # ← Изменено: x64 → ia32 (Flutter использует ia32 для x86 Windows)
          mv ./flutter/build/windows/ia32/runner/Release ./rustdesk

          # Download usbmmidd_v2.zip (универсальный, без изменений)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath . -Force
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

          # ... [остальная логика сборки драйверов — без изменений] ...

      # ... [шаги с иконками, логотипом, Runner.res — без изменений] ...

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@master
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts  # ← Убедитесь, что воркфлоу TopMostWindow собрал Win32-версию
          path: "./rustdesk"

      # ... [шаги подписи, zip, portable-упаковки — без изменений] ...

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          mv "./rustdesk/rustdesk.exe" "./rustdesk/${{ env.appname }}.exe" || echo "rustdesk.exe"
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e "../../rustdesk/${{ env.appname }}.exe"
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe "./SignOutput/rustdesk.exe"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build msi
        continue-on-error: true
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          $myappname = "${{ env.appname }}" -replace '\s','_'
          cp "rustdesk/${{ env.appname }}.exe" "rustdesk/${myappname}.exe" -ErrorAction SilentlyContinue
          pushd ./res/msi
          python preprocess.py --app-name "$myappname" --arp -d ../../rustdesk
          nuget restore msi.sln
          # ← Изменено: Platform=x64 → Platform=Win32
          msbuild msi.sln -p:Configuration=Release -p:Platform=Win32 /p:TargetVersion=Windows10
          cp ./Package/bin/Win32/Release/en-us/Package.msi ../../SignOutput/rustdesk-latest.msi
          mv ./Package/bin/Win32/Release/en-us/Package.msi ../../SignOutput/rustdesk.msi
          sha256sum ../../SignOutput/rustdesk.msi

      # ... [финальные шаги подписи, переименования — без изменений] ...

      - name: Upload SigmaDesk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SigmaDesk-Windows-x86  # ← Добавлен суффикс -x86
          path: |
            ./SignOutput/${{ env.filename }}.exe
            ./SignOutput/${{ env.filename }}.msi
